<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Outer Gray Ring -->
  <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#5a5a5a" stroke-width="12"/>
  
  <!-- Maroon RGUKT Human Symbol -->
  <g fill="#800000">
    <!-- Head -->
    <ellipse cx="200" cy="115" rx="28" ry="20" transform="rotate(-5 200 115)"/>
    
    <!-- Dynamic Human Body (Outstretched Arms & Legs) -->
    <path d="M 200 145 
             C 170 145, 140 120, 130 85 
             C 125 100, 145 135, 175 155 
             C 145 185, 120 200, 115 240 
             C 140 200, 175 175, 200 165 
             C 225 175, 260 200, 285 240 
             C 280 200, 255 185, 225 155 
             C 255 135, 275 100, 270 85 
             C 260 120, 230 145, 200 145 Z"/>
  </g>
  
  <!-- Text: Rajiv Gandhi University of Knowledge Technologies -->
  <text x="200" y="270" font-family="'Space Grotesk', 'Arial', sans-serif" font-weight="700" font-size="24" fill="#800000" text-anchor="middle">
    Rajiv Gandhi University
  </text>
  <text x="200" y="300" font-family="'Inter', 'Arial', sans-serif" font-weight="500" font-size="20" fill="#800000" text-anchor="middle">
    of Knowledge Technologies
  </text>
</svg>
